server {
    listen 80;
    server_name _; # Binds to all server names or private IP

    # Enable Gzip Compression for fast page loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Static assets served directly by Nginx for low latency
    location /static/ {
        alias "E:/AntiG/CPM PERT/static/";
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy to Flask application running on local port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        
        # Standard proxy headers to forward client parameters
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 and header upgrades for WebSockets and Tunnel compatibility
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Increased timeouts for heavy calculations and matplotlib renderings
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
